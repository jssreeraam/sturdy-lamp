name: Build FocusGuard APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create base Flutter project
        run: flutter create --org com.focusguard --project-name focusguard --platforms=android build_app

      - name: Copy FocusGuard files in
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r lib build_app/lib
          cp -r assets build_app/assets
          M=build_app/android/app/src/main
          cp android/app/src/main/AndroidManifest.xml $M/AndroidManifest.xml
          mkdir -p $M/kotlin/com/focusguard/focusguard
          cp android/app/src/main/kotlin/com/focusguard/focusguard/*.kt $M/kotlin/com/focusguard/focusguard/
          mkdir -p $M/res/xml $M/res/values
          cp android/app/src/main/res/xml/*.xml $M/res/xml/
          cp android/app/src/main/res/values/strings.xml $M/res/values/strings.xml

      - name: Patch SDK versions and strip debug INTERNET permission
        run: |
          for f in build_app/android/app/build.gradle build_app/android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/^([[:space:]]*)minSdk(Version)?[[:space:]=]+.*/\1minSdk = 24/' "$f"
            sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]=]+.*/\1compileSdk = 35/' "$f"
            sed -i -E 's/^([[:space:]]*)targetSdk(Version)?[[:space:]=]+.*/\1targetSdk = 35/' "$f"
          done
          for m in debug profile; do
            F=build_app/android/app/src/$m/AndroidManifest.xml
            [ -f "$F" ] && sed -i '/INTERNET/d' "$F" || true
          done

      - name: Get packages
        working-directory: build_app
        run: flutter pub get

      - name: Build split APKs
        working-directory: build_app
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        working-directory: build_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-APKs
          path: build_app/build/app/outputs/flutter-apk/*.apk
